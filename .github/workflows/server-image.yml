name: Image Docker du serveur

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - apps/server/**
      - packages/shared/**
      - package.json
      - .github/workflows/server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On teste l'image qui sera publiée, pas une copie locale du code.
      - name: Construire l'image de test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          load: true
          tags: keeprunnin:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tests du moteur de jeu
        run: docker run --rm keeprunnin:test node --experimental-strip-types --no-warnings --test apps/server/src/game.test.ts

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/keep-runni-n
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ github.event.head_commit.timestamp }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
