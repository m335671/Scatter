name: App mobile (APK, IPA à la demande)

# Lancement manuel (onglet Actions → « Run workflow ») ou sur un tag v1.2.3.
# Pas de déclenchement à chaque push : le build iOS coûte des minutes macOS (×10 sur un dépôt privé).
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Adresse pré-remplie sur l'écran du serveur (facultatif)
        default: ''
      ios:
        description: Construire aussi l'IPA (minutes macOS, à cocher exprès)
        type: boolean
        default: false
  push:
    tags: ['v*']

env:
  # Le serveur se choisit dans l'app au premier lancement : rien de compilé par défaut.
  EXPO_PUBLIC_SERVER_URL: ${{ inputs.server_url }}
  NODE_ENV: production
  # Tag v1.2.3 → version 1.2.3 dans l'app et dans le nom des fichiers. Lancement manuel → « dev ».
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

permissions:
  contents: write # pour joindre les fichiers à la Release sur un tag

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Version de l'app
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/mobile
        run: node -e "const f='app.json',j=require('./'+f);j.expo.version=process.env.VERSION.slice(1);require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Projet Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: APK release (arm64)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      # Gradle signe avec la clé de debug du modèle Expo : on re-signe avec la clé Scatter (secrets du dépôt).
      # La lignée (rotation depuis la clé de debug) laisse les APK déjà installés se mettre à jour sans désinstaller
      # (Android 9+) : v2 avec l'ancienne clé, v3 avec la nouvelle. Pas de secrets (fork) : clé de debug.
      - name: Signature
        env:
          SCATTER_KEYSTORE: ${{ secrets.SCATTER_KEYSTORE }}
          SCATTER_KEYSTORE_PASS: ${{ secrets.SCATTER_KEYSTORE_PASS }}
          SCATTER_LINEAGE: ${{ secrets.SCATTER_LINEAGE }}
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if [ -z "$SCATTER_KEYSTORE" ]; then
            echo "::warning::Secret SCATTER_KEYSTORE absent : APK signé avec la clé de debug."
            mv "$APK" scatter-$VERSION.apk; exit 0
          fi
          echo "$SCATTER_KEYSTORE" | base64 -d > "$RUNNER_TEMP/scatter.jks"
          echo "$SCATTER_LINEAGE" | base64 -d > "$RUNNER_TEMP/scatter.lineage"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" sign --ks apps/mobile/android/app/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey \
            --next-signer --ks "$RUNNER_TEMP/scatter.jks" --ks-pass env:SCATTER_KEYSTORE_PASS --ks-key-alias scatter \
            --lineage "$RUNNER_TEMP/scatter.lineage" --rotation-min-sdk-version 28 --out scatter-$VERSION.apk "$APK"
          rm "$RUNNER_TEMP/scatter.jks" "$RUNNER_TEMP/scatter.lineage"
          "$BT/apksigner" verify -v --print-certs scatter-$VERSION.apk | grep "CN=Scatter"
      - uses: actions/upload-artifact@v4
        with:
          name: scatter-android
          path: scatter-*.apk
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: scatter-*.apk

  ios:
    # Jamais sur un tag : seulement en manuel, case « ios » cochée (minutes macOS).
    if: ${{ inputs.ios }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version de l'app
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/mobile
        run: node -e "const f='app.json',j=require('./'+f);j.expo.version=process.env.VERSION.slice(1);require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Projet iOS
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean
      # IPA non signée : Sideloadly (ou AltStore/SideStore) la signe avec l'Apple ID de l'utilisateur.
      - name: Archive sans signature
        working-directory: apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/scatter-$VERSION.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: scatter-ios
          path: scatter-*.ipa
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: scatter-*.ipa
