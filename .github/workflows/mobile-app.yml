name: App mobile (APK + IPA)

# Lancement manuel (onglet Actions → « Run workflow ») ou sur un tag v1.2.3.
# Pas de déclenchement à chaque push : le build iOS coûte des minutes macOS (×10 sur un dépôt privé).
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Adresse du serveur compilée dans l'app
        default: https://ton-serveur.example
      ios:
        description: Construire aussi l'IPA (minutes macOS, à cocher exprès)
        type: boolean
        default: false
  push:
    tags: ['v*']

env:
  EXPO_PUBLIC_SERVER_URL: ${{ inputs.server_url || 'https://ton-serveur.example' }}
  NODE_ENV: production
  # Tag v1.2.3 → version 1.2.3 dans l'app et dans le nom des fichiers. Lancement manuel → « dev ».
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'dev' }}

permissions:
  contents: write # pour joindre les fichiers à la Release sur un tag

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Version de l'app
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/mobile
        run: node -e "const f='app.json',j=require('./'+f);j.expo.version=process.env.VERSION.slice(1);require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Projet Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install
      - name: APK release (arm64)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - run: mv apps/mobile/android/app/build/outputs/apk/release/app-release.apk scatter-$VERSION.apk
      - uses: actions/upload-artifact@v4
        with:
          name: scatter-android
          path: scatter-*.apk
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: scatter-*.apk

  ios:
    if: ${{ github.event_name == 'push' || inputs.ios }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version de l'app
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/mobile
        run: node -e "const f='app.json',j=require('./'+f);j.expo.version=process.env.VERSION.slice(1);require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Projet iOS
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean
      # IPA non signée : Sideloadly (ou AltStore/SideStore) la signe avec l'Apple ID de l'utilisateur.
      - name: Archive sans signature
        working-directory: apps/mobile/ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/scatter-$VERSION.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: scatter-ios
          path: scatter-*.ipa
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: scatter-*.ipa
